# Pandora — memória com zram-only (sem swap em disco)
# zram é swap "barato" (RAM comprimida): vale empurrar páginas frias para lá cedo,
# em vez de descartar page cache quente (binários/libs da UI). Ref: ArchWiki Zram.
vm.swappiness = 180
# Sem readahead de swap: zram é aleatório e rápido, cluster>0 só desperdiça CPU.
vm.page-cluster = 0
# Não "inflar" a watermark após fragmentação; mantém reserva estável e maior,
# para kswapd acordar antes do direct reclaim (que é o que congela a UI).
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
