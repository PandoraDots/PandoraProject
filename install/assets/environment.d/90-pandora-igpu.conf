# Pandora hybrid: default the whole session to Intel/Mesa so NVIDIA RTD3 can sleep when idle.
# prime-run / prime-env clear these and force the dGPU for heavy work.
__GLX_VENDOR_LIBRARY_NAME=mesa
__NV_PRIME_RENDER_OFFLOAD=0
VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/intel_icd.json
WLR_DRM_DEVICES=/dev/dri/card1:/dev/dri/card0
