# Pandora hybrid: NVIDIA RTD3 / Dynamic Power Management (fine-grained).
# GPU stays in D3cold until prime-run (or any nvidia client) wakes it.
#
# PreserveVideoMemoryAllocations=0 allows VRAM to power off; suspend/hibernate
# of NVIDIA clients is less reliable — prefer closing prime-run apps first.
#
# VideoMemoryThreshold raised above the idle driver reservation (~300–400 MiB)
# so the GPU can still turn memory off when no real clients are using VRAM.
options nvidia_drm modeset=1 fbdev=1
options nvidia NVreg_DynamicPowerManagement=0x02 NVreg_DynamicPowerManagementVideoMemoryThreshold=512 NVreg_PreserveVideoMemoryAllocations=0
